<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroSave - Contributions</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <a href="/dashboard" class="navbar-brand">MicroSave</a>
        <div class="navbar-menu">
            <a href="/dashboard">Dashboard</a>
            <a href="/groups">Groups</a>
            <a href="/members">Members</a>
            <a href="/contributions">Contributions</a>
            <a href="/loans">Loans</a>
            <a href="/repayments">Repayments</a>
        </div>
    </nav>

    <div class="container">
        <div class="section-header">
            <h2>Contributions</h2>
        </div>

        <div id="alert-box"></div>

        <div class="form-container">
            <h3>Record Contribution</h3>
            <form id="contribution-form" class="mt-1">
                <div class="form-group">
                    <label for="memberId">Member</label>
                    <select id="memberId" name="memberId" class="form-control" required>
                        <!-- Loaded via JS -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount" min="1" step="0.01" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="contributionDate">Date</label>
                    <input type="date" id="contributionDate" name="contributionDate" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Record Contribution</button>
            </form>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Member</th>
                        <th>Amount</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="contributions-table-body">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('contributionDate').valueAsDate = new Date();
            loadMembersDropdown('memberId');
            loadContributions();
            setupFormSubmit('contribution-form', '/api/contributions', 'Contribution recorded successfully!', loadContributions);
        });

        async function loadContributions() {
            try {
                const contributions = await apiCall('/api/contributions');
                const tbody = document.getElementById('contributions-table-body');
                tbody.innerHTML = '';
                
                contributions.sort((a,b) => b.contributionId - a.contributionId).forEach(c => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${c.contributionId}</td>
                        <td>${c.member.name}</td>
                        <td>${formatCurrency(c.amount)}</td>
                        <td>${formatDate(c.contributionDate)}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error(error);
            }
        }
    </script>
</body>
</html>
