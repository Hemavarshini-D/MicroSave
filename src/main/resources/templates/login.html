<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroSave - Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">MicroSave</a>
        <div class="navbar-menu">
            <a href="/">Home</a>
            <a href="/dashboard">Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-container" style="max-width: 440px; margin-top: 3.5rem;">
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <h2 style="color: var(--primary-color); margin-bottom: 0.4rem; font-size: 1.6rem;">Welcome Back</h2>
                <p style="color: #666; font-size: 0.95rem;">Sign in to your MicroSave account</p>
            </div>

            <div id="alert-box" class="alert alert-danger" th:if="${error != null}" th:text="${error}" style="display: block;"></div>
            <div id="client-alert-box" class="alert" style="display: none;"></div>

            <form id="login-form" method="POST" th:action="@{/login}" novalidate>
                <div class="form-group">
                    <label for="username">Email or Username</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Enter username or email" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" autocomplete="current-password" required style="padding-right: 2.75rem;">
                        <button type="button" id="toggle-password" aria-label="Toggle password visibility" title="Toggle password visibility" style="position: absolute; right: 0.75rem; background: none; border: none; cursor: pointer; color: var(--secondary-color); padding: 0.25rem; display: flex; align-items: center;">
                            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Sign In</button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #666; border-top: 1px solid #eee; padding-top: 1.25rem;">
                <span>Looking for the public overview? </span>
                <a href="/" style="color: var(--accent-color); text-decoration: none; font-weight: 500;">Back to Home</a>
            </div>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const togglePasswordBtn = document.getElementById('toggle-password');
            const eyeIcon = document.getElementById('eye-icon');
            const alertBox = document.getElementById('client-alert-box');
            const serverAlert = document.getElementById('alert-box');
            const loginBtn = document.getElementById('login-btn');

            // Password visibility toggle
            if (togglePasswordBtn && passwordInput && eyeIcon) {
                togglePasswordBtn.addEventListener('click', () => {
                    const isPassword = passwordInput.getAttribute('type') === 'password';
                    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                    
                    if (isPassword) {
                        eyeIcon.innerHTML = `
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        `;
                    } else {
                        eyeIcon.innerHTML = `
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        `;
                    }
                });
            }

            function showAlert(type, message) {
                if (serverAlert) serverAlert.style.display = 'none';
                if (!alertBox) return;
                alertBox.className = `alert alert-${type}`;
                alertBox.textContent = message;
                alertBox.style.display = 'block';
            }

            function clearAlert() {
                if (alertBox) alertBox.style.display = 'none';
                if (serverAlert) serverAlert.style.display = 'none';
                usernameInput.style.borderColor = '#ccc';
                passwordInput.style.borderColor = '#ccc';
            }

            usernameInput.addEventListener('input', () => {
                usernameInput.style.borderColor = '#ccc';
            });

            passwordInput.addEventListener('input', () => {
                passwordInput.style.borderColor = '#ccc';
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                clearAlert();

                const username = usernameInput.value.trim();
                const password = passwordInput.value;

                if (!username) {
                    showAlert('danger', 'Please enter your email or username.');
                    usernameInput.style.borderColor = 'var(--danger-color)';
                    usernameInput.focus();
                    return;
                }

                if (!password) {
                    showAlert('danger', 'Please enter your password.');
                    passwordInput.style.borderColor = 'var(--danger-color)';
                    passwordInput.focus();
                    return;
                }

                if (password.length < 4) {
                    showAlert('danger', 'Password must be at least 4 characters long.');
                    passwordInput.style.borderColor = 'var(--danger-color)';
                    passwordInput.focus();
                    return;
                }

                // Show success feedback and redirect to existing dashboard
                showAlert('success', 'Login successful! Redirecting to dashboard...');
                loginBtn.disabled = true;
                loginBtn.textContent = 'Redirecting...';
                
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 500);
            });
        });
    </script>
</body>
</html>
