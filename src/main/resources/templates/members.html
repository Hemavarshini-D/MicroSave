<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroSave - Members</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <a href="/dashboard" class="navbar-brand">MicroSave</a>
        <div class="navbar-menu">
            <a href="/dashboard">Dashboard</a>
            <a href="/groups">Groups</a>
            <a href="/members">Members</a>
            <a href="/contributions">Contributions</a>
            <a href="/loans">Loans</a>
            <a href="/repayments">Repayments</a>
        </div>
    </nav>

    <div class="container">
        <div class="section-header">
            <h2>Members</h2>
        </div>

        <div id="alert-box"></div>

        <div class="form-container">
            <h3>Add New Member</h3>
            <form id="member-form" class="mt-1">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="text" id="phone" name="phone" class="form-control">
                </div>
                <div class="form-group">
                    <label for="groupId">Group</label>
                    <select id="groupId" name="groupId" class="form-control" required>
                        <!-- Loaded via JS -->
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Add Member</button>
            </form>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Group</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="members-table-body">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>
        
        <div id="balance-details" class="card mt-2" style="display:none;">
            <h3>Member Balance Details</h3>
            <p><strong>Total Savings:</strong> <span id="member-savings"></span></p>
            <p><strong>Outstanding Loan:</strong> <span id="member-loan"></span></p>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadGroupsDropdown('groupId');
            loadMembers();
            setupFormSubmit('member-form', '/api/members', 'Member added successfully!', loadMembers);
        });

        async function loadMembers() {
            try {
                const members = await apiCall('/api/members');
                const tbody = document.getElementById('members-table-body');
                tbody.innerHTML = '';
                
                members.forEach(member => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${member.memberId}</td>
                        <td>${member.name}</td>
                        <td>${member.phone || '-'}</td>
                        <td>${member.group.groupName}</td>
                        <td><button class="btn btn-sm btn-success" onclick="viewBalance(${member.memberId})">View Balance</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error(error);
            }
        }
        
        async function viewBalance(memberId) {
            try {
                const bal = await apiCall(`/api/members/${memberId}/balance`);
                document.getElementById('member-savings').textContent = formatCurrency(bal.totalSavings);
                document.getElementById('member-loan').textContent = formatCurrency(bal.outstandingLoan);
                document.getElementById('balance-details').style.display = 'block';
            } catch(e) {
                showMessage('danger', e.message);
            }
        }
    </script>
</body>
</html>
